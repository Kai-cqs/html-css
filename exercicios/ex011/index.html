<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midias</title>
</head>
<body>
    <h1>imagem dinamica</h1>
    <p>abra em dispositivos diferentes</p>
    <picture>
        <source media="(max-width: 750px )" srcset="imagens/foto-pequena" type="image/png">
        <source media="(max-width: 750px)" srcset="imagens/foto-pequena.png" type="image/png">
        <source media="(max-width: 1050px )" srcset="imagens/foto-media.png" type="image/png">
        <img src="imagens/foto-grande.png" alt="imagem flexivel">
    </picture>
    <h1>reproduzindo audios</h1>
    <p>reproduzindo audios</p>
    <audio preload="metadata" autoplay controls loop>
        <source src="midias/Lost Myself - Lalanne.mp3" type="audio/mpeg">
        <p>infelizmente seu navegador nao consegue reproduzir audio</p>
        <a href="midias/Lost Myself - Lalanne.mp3">
            clique aqui pra baixar o arquivo0
        </a>
    </audio>
</body>
</html>
