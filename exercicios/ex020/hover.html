<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div > p{
            display: none;

        }
        div:hover > p {
            display: block;
            color: white;
            background-color: red;
        }
        div:hover{
            color: red;
        }
    </style>
</head>
<body>
    
        <h1>passe o mouse sobre o texto abaixo</h1>
        <div>passe o mouse aqui
            <p>texto excondido</p>
        </div>
        
    
</body>
</html>
